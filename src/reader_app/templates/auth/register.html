{% extends "base.html" %}
{% block title %}Register · Reader{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Create your library</h1>
  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" minlength="2" required autofocus></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" minlength="8" required></label>
    <button class="primary" type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</section>
{% endblock %}
