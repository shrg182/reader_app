{% extends "base.html" %}
{% block title %}Log in · Reader{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Welcome back</h1>
  <p class="muted">Continue where you left off.</p>
  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username or email<input name="identity" required autofocus></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
