{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }} · Reader{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<section class="panel error-page">
  <p class="eyebrow">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="primary button" href="{{ url_for('library.index') }}">Return to Reader</a>
</section>
{% endblock %}
